<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Korkeakoulutettujen sijoittuminen: työllisyys, työttömyys ja tulot tutkinnoittain ja oppilaitoksittain."
    />
    <title>Sijoittumisdata · Korkeakoulutetut 2023</title>
    <script>
      // Apply the stored theme before the first paint to avoid a flash.
      try {
        const stored = localStorage.getItem("theme");
        const dark =
          stored === "dark" ||
          (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
